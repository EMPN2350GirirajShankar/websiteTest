# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
#
# Sveltia CMS configuration
# -------------------------
# This file is the entire CMS. There is no server: the admin app runs in the
# editor's browser and commits directly to GitHub via the GitHub API. A commit
# triggers the existing GitHub Actions deploy workflow, which rebuilds the site.
#
# Sign-in: open /admin/ and click "Sign In with GitHub". The OAuth handshake goes
# through the worker named in `base_url` below; editors never handle a token.
# Write access still comes from being a repo collaborator, not from signing in.
#
# Fallback: "Sign In Using Access Token" also works, but ONLY with a CLASSIC
# token carrying the `repo` scope. Fine-grained tokens cannot write to a repo you
# are merely a collaborator on, so the CMS reports "You don't have access to the
# ... repository" even though `git push` works fine.

backend:
  name: github
  repo: EMPN2350GirirajShankar/websiteTest
  branch: main
  # Deployed sveltia-cms-auth Cloudflare Worker. It holds the GitHub OAuth client
  # secret, which cannot live in a static site. Its GITHUB_CLIENT_ID /
  # GITHUB_CLIENT_SECRET / ALLOWED_DOMAINS vars are set in the Cloudflare
  # dashboard, and the OAuth app's callback URL must be this URL + /callback.
  # Removing this line reverts the CMS to access-token sign-in.
  base_url: https://sveltia-cms-auth.mylabiiit.workers.dev
  commit_messages:
    create: "content: create {{collection}} \"{{slug}}\""
    update: "content: update {{collection}} \"{{slug}}\""
    delete: "content: delete {{collection}} \"{{slug}}\""
    uploadMedia: "content: upload {{path}}"
    deleteMedia: "content: delete {{path}}"

# Uploaded images live in the public folder so Vite copies them verbatim.
# `public_folder` is the URL path the site uses; `assetUrl()` prepends the
# Vite base ("/websiteTest/") at render time, so keep this root-relative.
media_folder: /public/images/uploads
public_folder: /images/uploads

# Base URL for the CMS "View on live site" / preview links. Must match the repo
# in `backend` above: this is the testing fork, deployed to GitHub Pages under
# the /websiteTest/ project path. Switch to https://www.maqsoftware.com at the
# same time as `backend.repo`.
site_url: https://empn2350girirajshankar.github.io/websiteTest
# Root-relative, so it must include the Vite `base` from vite.config.ts.
logo_url: /websiteTest/favicon.png

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

collections:
  # -------------------------------------------------------- Case studies ----
  # Cards appear on /insights/case-studies alongside the older studies that
  # still live in src/data/insights.ts. The Technology, Service and Industry
  # values below MUST match `caseStudyTechnologyFilters` / `caseStudyFilters` /
  # `caseStudyIndustryFilters` in that file, otherwise the study is only
  # reachable under the "All" options.
  - name: caseStudies
    label: Case studies
    label_singular: Case study
    description: Client outcomes published at /insights/case-studies.
    folder: /content/case-studies
    extension: md
    format: yaml-frontmatter
    create: true
    delete: true
    slug: "{{fields.slug}}"
    path: "{{slug}}"
    preview_path: insights/case-studies/{{fields.slug}}
    summary: "{{title}} — {{date | date('YYYY-MM-DD')}}"
    sortable_fields:
      fields: [date, title]
      default:
        field: date
        direction: descending
    view_groups:
      - label: Service
        field: service
      - label: Industry
        field: industry
    fields:
      - { label: Title, name: title, widget: string }
      - label: URL slug
        name: slug
        widget: string
        hint: Lowercase words separated by hyphens. Becomes /insights/case-studies/<slug> and the file name.
        pattern: ["^[a-z0-9]+(?:-[a-z0-9]+)*$", "Use lowercase letters, numbers and hyphens only"]
      - { label: Publish date, name: date, widget: datetime, format: "YYYY-MM-DD", time_format: false }
      - label: Technology
        name: tag
        widget: select
        default: Microsoft Fabric
        hint: Drives the Technology filter on /insights/case-studies and the chip on the study page.
        options:
          - Microsoft Fabric
          - Power BI
          - Copilot
          - Databricks
          - Snowflake
          - Azure
          - Security
          - Dynamics 365
          - Power Apps
          - Power Platform
      - label: Service
        name: service
        widget: select
        required: false
        hint: Which service filter this study appears under.
        options:
          - Data & AI platforms
          - AI solutions & agents
          - Insights & analytics
          - Business apps & automation
          - Cloud modernization
          - Security & governance
      - label: Industry
        name: industry
        widget: select
        required: false
        hint: Which industry filter this study appears under.
        options:
          - Retail & consumer goods
          - Financial services
          - Technology
          - Manufacturing
          - Healthcare & life sciences
          - Public sector
      - label: Summary
        name: excerpt
        widget: text
        required: false
        hint: One or two sentences shown on the card. Falls back to the start of the body.
      - { label: Card image, name: image, widget: image, required: false }
      - { label: Card image alt text, name: imageAlt, widget: string, required: false }
      - label: Draft
        name: draft
        widget: boolean
        default: false
        hint: Drafts stay in the repository but are never rendered on the site.

      # Page shell. Only changes the header treatment above the sections; the
      # section list below is freely composable under every template. Adding a
      # template means adding an option here and an entry in ARTICLE_TEMPLATES
      # in src/components/content/ContentArticle.tsx.
      - label: Template
        name: template
        widget: select
        default: standard
        hint: Standard = text first. Image first = cover banner above the title. Compact = no cover image.
        options:
          - { label: Standard, value: standard }
          - { label: Image first, value: image-first }
          - { label: Compact, value: compact }

      # Section builder. Add, delete, duplicate and drag to reorder. Each type
      # maps to a component in src/components/content/sections/SectionRenderer.tsx.
      # An entry that uses Sections ignores the legacy Body field below.
      - label: Sections
        name: sections
        widget: list
        required: false
        collapsed: true
        minimize_collapsed: true
        add_to_top: false
        label_singular: Section
        hint: Build the page section by section. Drag the handle to reorder.
        types:
          - label: Text
            name: rich_text
            summary: "Text — {{fields.heading}}"
            fields:
              - { label: Heading, name: heading, widget: string, required: false }
              - { label: Body, name: body, widget: richtext }

          - label: Pull quote
            name: pull_quote
            summary: "Quote — {{fields.attribution}}"
            fields:
              - { label: Quote, name: quote, widget: text }
              - { label: Name, name: attribution, widget: string, required: false }
              - { label: Role and company, name: role, widget: string, required: false }

          - label: Stat band
            name: stat_band
            summary: "Stats — {{fields.items.length}} item(s)"
            fields:
              - label: Stats
                name: items
                widget: list
                min: 1
                max: 4
                label_singular: Stat
                summary: "{{fields.value}} — {{fields.label}}"
                fields:
                  - { label: Value, name: value, widget: string, hint: "Short. For example 40% or 2,000." }
                  - { label: Label, name: label, widget: string }

          - label: Callout box
            name: highlight
            summary: "Callout — {{fields.heading}}"
            fields:
              - { label: Heading, name: heading, widget: string, required: false }
              - { label: Body, name: body, widget: richtext }

          - label: Image
            name: image
            summary: "Image — {{fields.caption}}"
            thumbnail: image
            fields:
              - { label: Image, name: image, widget: image }
              - { label: Alt text, name: alt, widget: string, hint: Describe the image for screen readers. }
              - { label: Caption, name: caption, widget: string, required: false }

          - label: Technology list
            name: tech_table
            summary: "Technology — {{fields.rows.length}} row(s)"
            fields:
              - { label: Heading, name: heading, widget: string, required: false, default: Inside the tech }
              - label: Rows
                name: rows
                widget: list
                min: 1
                label_singular: Row
                summary: "{{fields.product}}"
                fields:
                  - { label: Product, name: product, widget: string }
                  - { label: Link, name: url, widget: string, required: false }
                  - { label: How it was used, name: purpose, widget: string }

          - label: Key takeaways
            name: key_takeaways
            summary: "Takeaways — {{fields.items.length}} item(s)"
            fields:
              - { label: Heading, name: heading, widget: string, required: false, default: What to take from it }
              - label: Takeaways
                name: items
                widget: list
                min: 1
                label_singular: Takeaway
                field: { label: Takeaway, name: text, widget: string }

          - label: Feature split
            name: feature_split
            summary: "Feature split — {{fields.heading}}"
            thumbnail: image
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string, required: false, default: Overview }
              - { label: Heading, name: heading, widget: string, required: false }
              - { label: Body, name: body, widget: richtext, required: false }
              - { label: Image, name: image, widget: image, required: false }
              - { label: Image alt text, name: imageAlt, widget: string, required: false }
              - label: Image side
                name: imagePosition
                widget: select
                default: left
                options:
                  - { label: Left, value: left }
                  - { label: Right, value: right }
              - { label: Quote, name: quote, widget: text, required: false, hint: Optional highlighted quote under the body. }
              - { label: Citation name, name: attribution, widget: string, required: false }
              - { label: Citation role and company, name: role, widget: string, required: false }
              - label: Slide up on scroll
                name: animate
                widget: boolean
                default: true
                hint: Ignored for visitors who prefer reduced motion.

          - label: Call to action
            name: cta
            summary: "CTA — {{fields.heading}}"
            fields:
              - { label: Heading, name: heading, widget: string, required: false }
              - { label: Body, name: body, widget: richtext, required: false }
              - { label: Button label, name: buttonLabel, widget: string, required: false }
              - { label: Button link, name: buttonUrl, widget: string, required: false, default: /contact }

      # Legacy single-body field. Kept so the existing case studies keep
      # rendering. Used only when Sections above is empty.
      - label: Body (legacy)
        name: body
        widget: richtext
        required: false
        hint: Only used when Sections is empty. New case studies should use Sections.

  # ------------------------------------------------ Best practice guides ----
  # Cards appear on /insights/best-practice-guides. Topic MUST match a label in
  # `bestPracticeFilters` in src/data/insights.ts to be filterable.
  - name: guides
    label: Best practice guides
    label_singular: Best practice guide
    description: Implementation playbooks published at /insights/best-practice-guides.
    folder: /content/guides
    extension: md
    format: yaml-frontmatter
    create: true
    delete: true
    slug: "{{fields.slug}}"
    path: "{{slug}}"
    preview_path: insights/guides/{{fields.slug}}
    summary: "{{title}} — {{date | date('YYYY-MM-DD')}}"
    sortable_fields:
      fields: [date, title]
      default:
        field: date
        direction: descending
    view_groups:
      - label: Topic
        field: topic
    fields:
      - { label: Title, name: title, widget: string }
      - label: URL slug
        name: slug
        widget: string
        hint: Lowercase words separated by hyphens. Becomes /insights/guides/<slug> and the file name.
        pattern: ["^[a-z0-9]+(?:-[a-z0-9]+)*$", "Use lowercase letters, numbers and hyphens only"]
      - { label: Publish date, name: date, widget: datetime, format: "YYYY-MM-DD", time_format: false }
      - label: Topic
        name: topic
        widget: select
        default: Power BI
        hint: Which topic filter this guide appears under.
        options:
          - Copilot
          - Power BI
          - Databricks
          - Snowflake
          - Azure
          - Security
          - Dynamics 365
          - Power Apps
      - label: Summary
        name: excerpt
        widget: text
        required: false
        hint: One or two sentences shown on the card. Falls back to the start of the body.
      - { label: Card image, name: image, widget: image, required: false }
      - { label: Card image alt text, name: imageAlt, widget: string, required: false }
      - label: Draft
        name: draft
        widget: boolean
        default: false
        hint: Drafts stay in the repository but are never rendered on the site.
      - { label: Body, name: body, widget: richtext }

  # -------------------------------------------------------------- Events ----
  # Cards appear on /events, grouped into Upcoming / Past by date, alongside the
  # hand-built event pages in src/data/events.ts.
  - name: events
    label: Events
    label_singular: Event
    description: Conference talks, webinars and workshops published at /events.
    folder: /content/events
    extension: md
    format: yaml-frontmatter
    create: true
    delete: true
    slug: "{{fields.slug}}"
    path: "{{slug}}"
    preview_path: events/{{fields.slug}}
    summary: "{{title}} — {{startDate | date('YYYY-MM-DD')}}"
    sortable_fields:
      fields: [startDate, title]
      default:
        field: startDate
        direction: descending
    fields:
      - { label: Title, name: title, widget: string }
      - label: URL slug
        name: slug
        widget: string
        hint: Lowercase words separated by hyphens. Becomes /events/<slug> and the file name.
        pattern: ["^[a-z0-9]+(?:-[a-z0-9]+)*$", "Use lowercase letters, numbers and hyphens only"]
      - { label: Start date, name: startDate, widget: datetime, format: "YYYY-MM-DD", time_format: false }
      - { label: End date, name: endDate, widget: datetime, format: "YYYY-MM-DD", time_format: false, required: false }
      - label: Event type
        name: eventType
        widget: select
        default: Conference
        options: [Conference, Webinar, Workshop, Meetup, Roundtable]
      - { label: Location, name: location, widget: string, hint: "e.g. Seattle, WA or Online" }
      - { label: Registration link, name: registrationUrl, widget: string, required: false }
      - { label: Summary, name: summary, widget: text }
      - { label: Hero image, name: image, widget: image, required: false }
      - { label: Hero image alt text, name: imageAlt, widget: string, required: false }
      - { label: Draft, name: draft, widget: boolean, default: false }
      - { label: Body, name: body, widget: richtext }

  # ------------------------------------------------------------- Careers ----
  # Openings appear in the accordion on /careers under their region. CMS roles
  # are listed above the legacy Blogger feed until that migration is finished.
  - name: careers
    label: Job openings
    label_singular: Job opening
    description: Roles published in the careers accordion at /careers.
    folder: /content/careers
    extension: md
    format: yaml-frontmatter
    create: true
    delete: true
    slug: "{{fields.slug}}"
    path: "{{slug}}"
    preview_path: careers
    summary: "{{title}} — {{region}}"
    sortable_fields:
      fields: [date, title]
      default:
        field: date
        direction: descending
    view_groups:
      - label: Region
        field: region
    fields:
      - { label: Job title, name: title, widget: string }
      - label: URL slug
        name: slug
        widget: string
        hint: Lowercase words separated by hyphens. Used as the file name.
        pattern: ["^[a-z0-9]+(?:-[a-z0-9]+)*$", "Use lowercase letters, numbers and hyphens only"]
      - label: Region
        name: region
        widget: select
        default: us
        hint: Which tab on /careers this role is listed under.
        options:
          - { label: United States, value: us }
          - { label: India, value: india }
      - label: Location
        name: location
        widget: string
        required: false
        hint: "Shown after the job title, e.g. Redmond, WA or Hyderabad."
      - { label: Posted date, name: date, widget: datetime, format: "YYYY-MM-DD", time_format: false }
      - label: Apply link
        name: applyUrl
        widget: string
        required: false
        hint: JobScore URL. Without it the "Apply on JobScore" button is hidden.
      - label: Summary
        name: excerpt
        widget: text
        required: false
        hint: Plain-text preview. Falls back to the start of the description.
      - label: Draft
        name: draft
        widget: boolean
        default: false
        hint: Drafts stay in the repository but are never rendered on the site.
      - { label: Job description, name: body, widget: richtext }
